name: auto-merge
on:
  pull_request:
    types:
      - ready_for_review
jobs:
  merge:
    if: github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: 검증 체크 완료 대기
        id: wait
        env:
          # 체크 조회는 읽기 전용이라 기본 토큰을 쓴다.
          # App 토큰에는 Checks 권한이 없어 check-runs API가 403을 낸다.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ready_for_review 직후에는 검증 워크플로가 아직 체크로 등록되지 않았을
          # 수 있으므로 먼저 잠깐 기다린다. 이 잡 자신은 대기 대상에서 제외한다.
          sleep 30
          for i in $(seq 1 60); do
            CHECKS=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
              --jq "[.check_runs[] | select(.details_url | contains(\"/runs/${GITHUB_RUN_ID}/\") | not) | {name, status, conclusion}]")
            FAILED=$(printf '%s' "$CHECKS" | jq '[.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length')
            PENDING=$(printf '%s' "$CHECKS" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$FAILED" -gt 0 ]; then
              printf '%s\n' "$CHECKS" | jq .
              echo "실패한 검증 체크가 있어 머지하지 않는다"
              exit 1
            fi
            if [ "$PENDING" -eq 0 ]; then
              echo "체크 $(printf '%s' "$CHECKS" | jq length)개 모두 통과 (0개면 검증 없는 레포)"
              exit 0
            fi
            echo "대기 중: ${PENDING}개 진행 중"
            sleep 30
          done
          echo "제한 시간 안에 검증 체크가 끝나지 않았다"
          exit 1
      - name: 검증 실패 코멘트
        if: failure() && steps.wait.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "$(printf '🤖 자동 머지 보류: 검증 체크가 실패했거나 제한 시간 안에 끝나지 않았습니다. 원인 해결 후 draft로 되돌렸다가 다시 해제하면 재시도합니다.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)')"
      - name: squash 머지
        id: squash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if gh pr merge "$PR" --repo "$REPO" --squash --delete-branch; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.squash.outputs.merged == 'false'
        with:
          fetch-depth: 0
      - name: 실패 원인 확인 후 라벨·코멘트
        if: steps.squash.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          BOT_ID=$(gh api "/users/${BOT}%5Bbot%5D" --jq .id)
          git config user.name "${BOT}[bot]"
          git config user.email "${BOT_ID}+${BOT}[bot]@users.noreply.github.com"
          git fetch origin "$HEAD_REF" master
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          if git merge origin/master --no-commit --no-ff; then
            git merge --abort || true
            gh pr comment "$PR" --repo "$REPO" --body "자동 머지 실패: 충돌 또는 오류로 머지하지 못했습니다. 사람 확인이 필요합니다."
          else
            FILES=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
            git merge --abort || true
            gh pr edit "$PR" --repo "$REPO" --add-label conflict
            gh pr comment "$PR" --repo "$REPO" --body "$(printf '🤖 자동 머지 실패: master와 충돌이 있습니다.\n\n충돌 파일:\n%s\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)' "$FILES")"
          fi
          exit 1
